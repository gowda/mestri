version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      # Keep the build and framework baseline stable for the current
      # Spring Boot 3.3 / Kotlin 1.9 / Java 17 support target.
      - dependency-name: "gradle"
      - dependency-name: "org.springframework.boot:spring-boot-gradle-plugin"
      - dependency-name: "org.springframework.boot"
      - dependency-name: "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin"
      - dependency-name: "org.jetbrains.kotlin.jvm"
      - dependency-name: "jvm"
      - dependency-name: "org.jetbrains.kotlin.plugin.spring:org.jetbrains.kotlin.plugin.spring.gradle.plugin"
      - dependency-name: "org.jetbrains.kotlin.plugin.spring"
      - dependency-name: "plugin.spring"
      - dependency-name: "org.junit:junit-bom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.jlleitschuh.gradle.ktlint"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
